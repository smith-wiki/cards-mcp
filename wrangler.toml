name = "cards-mcp"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
# Variables set in the dashboard (ACCESS_TEAM_DOMAIN, ACCESS_AUD) survive deploys.
keep_vars = true

routes = [
  { pattern = "cards-mcp.smith.wiki", custom_domain = true },
]

[triggers]
# Index Cards and Blog posts that reached the repositories without passing through create_card.
crons = ["*/15 * * * *"]

# No database_id: the first deploy creates the database and keeps it bound.
# The Worker creates its tables itself (src/schema.ts); no migration step.
[[d1_databases]]
binding = "DB"
database_name = "smith-wiki-cards"

[[vectorize]]
binding = "VECTORS"
index_name = "smith-wiki-cards" # 1024 dimensions, cosine; authors are namespaces, no metadata index

[ai]
binding = "AI"

[[r2_buckets]]
binding = "FILES"
bucket_name = "smith-wiki"

[images]
binding = "IMAGES"

[vars]
CARDS_REPO = "smith-wiki/cards"
CARDS_BRANCH = "main"
CARD_SITE_URL = "https://cards.smith.wiki"
FILES_BASE_URL = "https://files.smith.wiki"
BLOG_REPO = "andysmith-ai/andysmith.ai"
BLOG_BRANCH = "main"
BLOG_SITE_URL = "https://andysmith.ai"
# The wiki starts from zero: blog Cards announced before this time are never indexed.
BLOG_SINCE = "2026-09-28T00:00:00Z"
AGENT_DID = "did:plc:d5v65aamjwvjv5hfgpty5c67"    # smith.wiki
OPERATOR_DID = "did:plc:zn65gh5rul6g53vapd5li5kr" # andysmith.ai

# Set in the dashboard (Settings -> Variables and Secrets), not here:
#   ACCESS_TEAM_DOMAIN  text    e.g. "example.cloudflareaccess.com"
#   ACCESS_AUD          text    Application Audience (AUD) tag of the cards-mcp.smith.wiki Access app
#   GITHUB_TOKEN        secret  fine-grained token, owner smith-wiki: contents read/write on
#                               smith-wiki/cards (the public blog repo needs no grant)
#
# Local development only (put in .dev.vars, never in production):
#   DEV_AUTH_BYPASS = "1"  skips the Cf-Access-Jwt-Assertion check for `wrangler dev`
